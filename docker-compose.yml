name: tracewhisper

x-service-env: &service-env
  KAFKA_BOOTSTRAP: kafka:9092
  CATALOG_URL: http://catalog:8000
  ORDERS_URL: http://orders:8000
  DB_PATH: /data/service.db
  DEPLOY_ENV: ${DEPLOY_ENV:-local}

services:
  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  catalog:
    build:
      context: ./services
      args:
        SERVICE: catalog
    environment:
      <<: *service-env
      SERVICE_NAME: catalog
    ports:
      - "8001:8000"
    volumes:
      - catalog-data:/data

  checkout:
    build:
      context: ./services
      args:
        SERVICE: checkout
    environment:
      <<: *service-env
      SERVICE_NAME: checkout
    ports:
      - "8002:8000"
    volumes:
      - checkout-data:/data
    depends_on:
      kafka:
        condition: service_healthy
      catalog:
        condition: service_started

  orders:
    build:
      context: ./services
      args:
        SERVICE: orders
    environment:
      <<: *service-env
      SERVICE_NAME: orders
    ports:
      - "8003:8000"
    volumes:
      - orders-data:/data
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  catalog-data:
  checkout-data:
  orders-data:
