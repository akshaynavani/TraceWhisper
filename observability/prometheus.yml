global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: shop-services
    metrics_path: /metrics
    static_configs:
      - targets: ["catalog:8000"]
        labels: { service: catalog }
      - targets: ["checkout:8000"]
        labels: { service: checkout }
      - targets: ["orders:8000"]
        labels: { service: orders }

  - job_name: otel-spanmetrics
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
