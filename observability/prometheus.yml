global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Service metrics already carry a `service` label, so no target labels here
  # (they would collide and be renamed to exported_service).
  - job_name: shop-services
    metrics_path: /metrics
    static_configs:
      - targets: ["catalog:8000", "checkout:8000", "orders:8000"]

  - job_name: otel-spanmetrics
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
